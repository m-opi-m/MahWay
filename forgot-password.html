<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - MahWay</title>
    <link rel="icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="portal.css">
</head>
<body class="portal-login-page">

    <div>
        <div class="login-card">
            <img src="logo.png" alt="MahWay" class="portal-logo">
            <h1>استعادة كلمة المرور</h1>
            <p class="subtitle" id="pageSubtitle">هنبعتلك كود على بريدك الإلكتروني عشان تقدر تغيّر كلمة المرور</p>

            <div class="reset-steps">
                <div class="step-dot active" id="dot1"></div>
                <div class="step-dot" id="dot2"></div>
                <div class="step-dot" id="dot3"></div>
            </div>

            <div class="login-error" id="errorBox">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <div class="login-success" id="successBox">
                <i class="fas fa-circle-check"></i>
                <span id="successText"></span>
            </div>

            <!-- الخطوة 1: إدخال البريد الإلكتروني -->
            <form class="login-form" id="stepEmailForm">
                <div class="field">
                    <label for="email"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                    <input type="email" id="email" required autocomplete="username">
                </div>
                <button type="submit" class="login-btn" id="sendCodeBtn">
                    <i class="fas fa-paper-plane"></i>
                    <span>إرسال الكود</span>
                </button>
            </form>

            <!-- الخطوة 2: إدخال الكود + كلمة المرور الجديدة -->
            <form class="login-form" id="stepResetForm" style="display:none;">
                <div class="reset-hint">
                    <i class="fas fa-circle-info"></i>
                    بعتنالك كود مكوّن من 6 أرقام على <strong id="targetEmailLabel"></strong>، الكود صالح لمدة 15 دقيقة.
                </div>
                <div class="field">
                    <label for="code"><i class="fas fa-key"></i> كود التحقق</label>
                    <input type="text" id="code" inputmode="numeric" maxlength="6" required placeholder="------">
                </div>
                <div class="field">
                    <label for="newPassword"><i class="fas fa-lock"></i> كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required autocomplete="new-password" minlength="6">
                </div>
                <div class="field">
                    <label for="confirmPassword"><i class="fas fa-lock"></i> تأكيد كلمة المرور الجديدة</label>
                    <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
                </div>
                <button type="submit" class="login-btn" id="resetBtn">
                    <i class="fas fa-rotate"></i>
                    <span>تغيير كلمة المرور</span>
                </button>
                <button type="button" class="link-btn" id="resendBtn">إعادة إرسال الكود</button>
            </form>

            <!-- الخطوة 3: تم بنجاح -->
            <div id="stepDone" style="display:none;">
                <p class="subtitle" style="margin-top:1rem;">تم تغيير كلمة المرور بنجاح. تقدر تسجل الدخول دلوقتي.</p>
                <a href="login.html" class="login-btn" style="text-decoration:none; margin-top:1rem;">
                    <i class="fas fa-right-to-bracket"></i>
                    <span>تسجيل الدخول</span>
                </a>
            </div>
        </div>
        <div style="text-align:center;">
            <a href="login.html" class="back-home-link"><i class="fas fa-arrow-right"></i> رجوع لصفحة الدخول</a>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3SBQ16fLDJkPrrbElvhR_vAPN7Pspw6REpP5kCaB2v78WMRc0RccEyXtCVxDbXgPO/exec';

        async function sha256(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function postToScript(payload) {
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            return res.json();
        }

        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        const successBox = document.getElementById('successBox');
        const successText = document.getElementById('successText');

        function showError(msg) {
            successBox.style.display = 'none';
            errorText.textContent = msg;
            errorBox.style.display = 'flex';
        }

        function showSuccess(msg) {
            errorBox.style.display = 'none';
            successText.textContent = msg;
            successBox.style.display = 'flex';
        }

        function hideMessages() {
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
        }

        let currentEmail = '';

        function goToStep(step) {
            document.getElementById('stepEmailForm').style.display = step === 1 ? 'flex' : 'none';
            document.getElementById('stepResetForm').style.display = step === 2 ? 'flex' : 'none';
            document.getElementById('stepDone').style.display = step === 3 ? 'block' : 'none';
            document.getElementById('pageSubtitle').style.display = step === 3 ? 'none' : 'block';

            ['dot1', 'dot2', 'dot3'].forEach((id, idx) => {
                const dot = document.getElementById(id);
                dot.classList.remove('active', 'done');
                if (idx + 1 < step) dot.classList.add('done');
                if (idx + 1 === step) dot.classList.add('active');
            });
        }

        document.getElementById('stepEmailForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideMessages();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.querySelector('span').textContent = 'جاري الإرسال...';

            try {
                const data = await postToScript({ type: 'forgotPasswordRequest', email: email });
                if (data.result === 'success') {
                    currentEmail = email;
                    document.getElementById('targetEmailLabel').textContent = email;
                    showSuccess(data.message || 'تم إرسال الكود');
                    goToStep(2);
                } else {
                    showError(data.message || 'حصل خطأ. حاول تاني.');
                }
            } catch (err) {
                console.error(err);
                showError('حصل خطأ في الاتصال. تأكد من الإنترنت وحاول تاني.');
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'إرسال الكود';
            }
        });

        document.getElementById('resendBtn').addEventListener('click', async function () {
            hideMessages();
            this.disabled = true;
            this.textContent = 'جاري إعادة الإرسال...';
            try {
                const data = await postToScript({ type: 'forgotPasswordRequest', email: currentEmail });
                if (data.result === 'success') {
                    showSuccess(data.message || 'تم إرسال كود جديد');
                } else {
                    showError(data.message || 'حصل خطأ. حاول تاني.');
                }
            } catch (err) {
                showError('حصل خطأ في الاتصال. حاول تاني.');
            } finally {
                this.disabled = false;
                this.textContent = 'إعادة إرسال الكود';
            }
        });

        document.getElementById('stepResetForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideMessages();

            const code = document.getElementById('code').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showError('كلمة المرور الجديدة وتأكيدها مش متطابقين');
                return;
            }
            if (newPassword.length < 6) {
                showError('كلمة المرور لازم تكون 6 أحرف على الأقل');
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.querySelector('span').textContent = 'جاري التغيير...';

            try {
                const newPasswordHash = await sha256(newPassword);
                const data = await postToScript({
                    type: 'forgotPasswordVerify',
                    email: currentEmail,
                    code: code,
                    newPasswordHash: newPasswordHash
                });

                if (data.result === 'success') {
                    goToStep(3);
                } else {
                    showError(data.message || 'حصل خطأ. حاول تاني.');
                }
            } catch (err) {
                console.error(err);
                showError('حصل خطأ في الاتصال. تأكد من الإنترنت وحاول تاني.');
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'تغيير كلمة المرور';
            }
        });

        goToStep(1);
    </script>
</body>
</html>
